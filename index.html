/* ============ STATE & PERSISTENCE ============ */
const LS_KEY='timelex_db_v1';
let db={};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
async function initData(){
  try{
    const doc = await fsDb.collection('timelex').doc('datos').get();
    if(doc.exists){
      db = doc.data();
      if(!db.inventory) db.inventory = [];
      if(!db.sales) db.sales = [];
      if(!db.expenses) db.expenses = [];
      if(!db.shipments) db.shipments = [];
    } else {
      db = seedDb();
      await fsDb.collection('timelex').doc('datos').set(db);
    }
  } catch(e){
    console.error('Firebase error, usando localStorage como fallback', e);
    const raw = localStorage.getItem(LS_KEY);
    db = raw ? JSON.parse(raw) : seedDb();
  }
  render();
}
function seedDb(){
  const d={
    inventory:SEED.models.map(m=>({id:uid(),...m})),
    sales:SEED.sales.map(s=>({id:uid(),...s})),
    expenses:SEED.expenses.map(e=>({id:uid(),...e})),
    shipments:[]
  };
  return d;
}
function save(){
  fsDb.collection('timelex').doc('datos').set(db)
    .catch(e => console.error('Error guardando', e));
}
function resetDb(){db=seedDb();save();render()}
function wipeDb(){db={inventory:[],sales:[],expenses:[],shipments:[]};save();render()}

/* ============ HELPERS ============ */
const usd=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
const bs=new Intl.NumberFormat('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const int=new Intl.NumberFormat('es-VE');
function fUSD(n){return usd.format(n||0)}
function fBs(n){return 'Bs '+bs.format(n||0)}
function fDate(iso){if(!iso)return '—';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
function fDateLong(iso){const[y,m,d]=iso.split('-');const ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return d+' '+ms[+m-1]+' '+y}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(msg){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}
function gdriveDirect(url){
  if(!url)return'';
  const m1=url.match(/drive\.google\.com\/file\/d\/([^\/\?&]+)/);
  if(m1)return'https://lh3.googleusercontent.com/d/'+m1[1];
  const m2=url.match(/drive\.google\.com\/(?:open|uc)\?.*[?&]id=([^&]+)/);
  if(m2)return'https://lh3.googleusercontent.com/d/'+m2[1];
  return url;
}

/* ============ VENTAS ============ */
let saleForm={fecha:todayISO(),modelo:'',tipoPago:'DIVISAS',monto:'',tasa:'',nota:'',delivery:false,delMoneda:'BOLIVARES',delMonto:'',delTasa:''};
function saleCalc(){
  const m=db.inventory.find(x=>x.id===saleForm.modelo);
  const monto=parseFloat(saleForm.monto)||0;
  const tasa=parseFloat(saleForm.tasa)||0;
  let ingreso=0;
  if(saleForm.tipoPago==='DIVISAS')ingreso=monto;
  else ingreso=tasa>0?monto/tasa:0;
  const costo=m?+m.costo:0;
  // delivery (opcional)
  let delUSD=0;
  if(saleForm.delivery){
    const dm=parseFloat(saleForm.delMonto)||0;const dt=parseFloat(saleForm.delTasa)||0;
    delUSD=saleForm.delMoneda==='DIVISAS'?dm:(dt>0?dm/dt:0);
  }
  const ganancia=ingreso-costo-delUSD;
  return {m,monto,tasa,ingreso,costo,delUSD,ganancia};
}
function viewVentas(){

  const isBs=saleForm.tipoPago==='BOLIVARES';
  const sales=[...db.sales].reverse();
  let rows=sales.map(s=>{
    const del=+s.deliveryUSD||0;
    const net=s.ganancia-del;
    return `<tr data-id="${s.id}">
      <td class="muted">${fDate(s.fecha)}</td>
      <td class="model-name">${esc(s.modelo)}</td>
      <td><span class="badge ${s.tipoPago==='DIVISAS'?'badge-div':'badge-bs'}">${s.tipoPago==='DIVISAS'?'Divisas':'Bolívares'}</span></td>
      <td class="num">${s.tipoPago==='DIVISAS'?fUSD(s.monto):fBs(s.monto)}</td>

/* ============ DASHBOARD ============ */
let dashMonth='total';
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function ymKey(iso){return (iso||'').slice(0,7)}
function ymLabel(ym){const[y,m]=ym.split('-');const l=MES[+m-1]+' '+y;return l.charAt(0).toUpperCase()+l.slice(1)}
function availableMonths(){
  const set=new Set();
  db.sales.forEach(s=>set.add(ymKey(s.fecha)));
  db.expenses.forEach(e=>set.add(ymKey(e.fecha)));
  set.add(ymKey(todayISO()));
  return [...set].filter(Boolean).sort();
}
function viewDashboard(){
  const months=availableMonths();
  if(dashMonth!=='total'&&!months.includes(dashMonth))dashMonth='total';
  const inSel=iso=>dashMonth==='total'||ymKey(iso)===dashMonth;
  const sales=db.sales.filter(s=>inSel(s.fecha));
  const expenses=db.expenses.filter(e=>inSel(e.fecha));
  const periodo=dashMonth==='total'?'Histórico completo':ymLabel(dashMonth);
  const unidades=sales.length;
  const facturacion=sales.reduce((a,s)=>a+s.ingresoUSD,0);
  const costos=sales.reduce((a,s)=>a+s.costoLanded,0);
  const gasto=expenses.reduce((a,e)=>a+e.gastoUSD,0);
  const ganancia=facturacion-costos-gasto;
  // chips
  const chips=`<span class="mlabel">Periodo</span><button class="mchip ${dashMonth==='total'?'on':''}" data-m="total">Total histórico</button>`+
    [...months].reverse().map(m=>`<button class="mchip ${dashMonth===m?'on':''}" data-m="${m}">${ymLabel(m)}</button>`).join('');
  // group by date (filtered)
  const map={};
  sales.forEach(s=>{const k=s.fecha;(map[k]=map[k]||{u:0,f:0,g:0}),map[k].u++,map[k].f+=s.ingresoUSD,map[k].g+=s.ganancia-(+s.deliveryUSD||0)});
  const days=Object.keys(map).sort();
  const maxF=Math.max(1,...days.map(d=>map[d].f));
  const recent=days.slice(-14);
  const bars=recent.map(d=>{
    const h=Math.round(map[d].f/maxF*140);
    return `<div class="bar-col"><div class="val">$${Math.round(map[d].f)}</div><div class="bar-stack"><div class="bar" style="height:${h}px"></div></div><div class="lbl">${fDate(d).slice(0,5)}</div></div>`;
  }).join('');
  const rowsDaily=[...days].reverse().map(d=>`<tr>
      <td>${fDateLong(d)}</td>
      <td class="num">${map[d].u}</td>
      <td class="num">${fUSD(map[d].f)}</td>
      <td class="num pos">${fUSD(map[d].g)}</td>
    </tr>`).join('')||`<tr><td colspan="4"><div class="empty">${ICON.box}<div>Sin ventas en ${esc(periodo.toLowerCase())}</div></div></td></tr>`;
  const facLbl=dashMonth==='total'?'Facturación histórica':'Facturación del mes';
  const ganLbl=dashMonth==='total'?'Ganancia neta total':'Ganancia neta del mes';
  return `<section class="section">
    <div class="sec-head"><div><h1>Dashboard</h1><p>${periodo} · ${unidades} ${unidades===1?'venta':'ventas'} en ${days.length} ${days.length===1?'día':'días'}</p></div></div>
    <div class="month-bar">${chips}</div>
    <div class="kpi-grid">
      <div class="kpi accent"><div class="k">Unidades vendidas</div><div class="v">${unidades}</div><div class="meta">relojes${dashMonth==='total'?' en total':''}</div></div>
      <div class="kpi"><div class="k">${facLbl}</div><div class="v">${fUSD(facturacion)}</div><div class="meta">ingreso real USD</div></div>
      <div class="kpi bad"><div class="k">Gasto operativo</div><div class="v">${fUSD(gasto)}</div><div class="meta">${expenses.length} ${expenses.length===1?'gasto':'gastos'}</div></div>
      <div class="kpi good"><div class="k">${ganLbl}</div><div class="v">${fUSD(ganancia)}</div><div class="meta">facturación − costos − gastos</div></div>
    </div>
    <div class="card card-pad" style="margin-bottom:26px">
      <div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:14px">Facturación diaria</strong><div class="legend"><span><i style="background:var(--gold)"></i>USD facturado por día</span></div></div>
      <div class="chart">${bars||'<div class="empty" style="width:100%">'+ICON.box+'<div>Sin ventas en '+esc(periodo.toLowerCase())+'</div></div>'}</div>
    </div>
    <div class="sec-head" style="margin-bottom:14px"><div><h1 style="font-size:18px">Resumen diario</h1><p>Agrupado automáticamente por fecha</p></div></div>
    <div class="table-wrap">
      <table><thead><tr><th>Fecha</th><th class="num">Unidades vendidas</th><th class="num">Facturación del día</th><th class="num">Ganancia del día</th></tr></thead>
      <tbody>${rowsDaily}</tbody></table>
    </div>
  </section>`;
}

/* ============ WIRING ============ */
function wire(){
  // Dashboard month chips
  document.querySelectorAll('.mchip').forEach(b=>b.onclick=()=>{dashMonth=b.dataset.m;const app=document.getElementById('app');app.innerHTML=viewDashboard();wire();});
  // Inventario
  const addBtn=document.getElementById('addModelBtn');
  if(addBtn)addBtn.onclick=openAddModel;
  const invS=document.getElementById('invSearch');
  if(invS)invS.oninput=e=>{invSearch=e.target.value;const pos=e.target.selectionStart;renderInvKeepFocus(pos)};
  document.querySelectorAll('.stock-cell').forEach(cell=>{
    const tr=cell.closest('tr');const id=tr.dataset.id;
    const input=cell.querySelector('.stock-input');
    cell.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const it=db.inventory.find(x=>x.id===id);
      it.stockActual=Math.max(0,(+it.stockActual||0)+(+b.dataset.step));
      save();input.value=it.stockActual;updateStockBadge(tr,it.stockActual);toast('Stock actualizado: '+it.modelo)});
    input.onchange=()=>{const it=db.inventory.find(x=>x.id===id);it.stockActual=Math.max(0,parseInt(input.value)||0);input.value=it.stockActual;save();updateStockBadge(tr,it.stockActual);toast('Stock actualizado')};
  });
  document.querySelectorAll('.edit-field').forEach(inp=>{
    const id=inp.closest('tr').dataset.id;const field=inp.dataset.field;
    inp.onchange=()=>{const it=db.inventory.find(x=>x.id===id);it[field]=Math.max(0,parseFloat(inp.value)||0);inp.value=it[field];save();
      const valor=db.inventory.reduce((a,m)=>a+(+m.stockActual||0)*(+m.costo||0),0);
      const pill=document.querySelector('.pill-summary span:last-child b');if(pill)pill.textContent=fUSD(valor);
      toast('Actualizado: '+it.modelo)};
    inp.onkeydown=e=>{if(e.key==='Enter')inp.blur()};
  });
  document.querySelectorAll('.act-del-model').forEach(b=>b.onclick=()=>{
    const id=b.closest('tr').dataset.id;const it=db.inventory.find(x=>x.id===id);
    confirmModal('Eliminar modelo','¿Eliminar "'+it.modelo+'" del inventario? Las ventas registradas no se borran.',()=>{db.inventory=db.inventory.filter(x=>x.id!==id);render();toast('Modelo eliminado')});
  });
  document.querySelectorAll('.photo-thumb').forEach(img=>{
    img.onclick=()=>openPhotoModal(img.dataset.photo,img.dataset.name);
  });
  document.querySelectorAll('.photo-edit-btn,.btn-add-photo').forEach(btn=>{
    btn.onclick=e=>{e.stopPropagation();openPhotoEdit(btn.dataset.id)};
  });

  // Ventas form
  const sf=document.getElementById('saleForm');
  if(sf){
    sf.querySelectorAll('[name]').forEach(el=>el.addEventListener('input',()=>{saleForm[el.name]=el.value;
      if(['monto','tasa','modelo','delMonto','delTasa'].includes(el.name))refreshCalc();}));
    sf.querySelectorAll('[data-seg="tipoPago"] button').forEach(b=>b.onclick=()=>{saleForm.tipoPago=b.dataset.v;if(b.dataset.v==='DIVISAS')saleForm.tasa='';renderKeep('ventas')});
    sf.querySelectorAll('[data-seg="delMoneda"] button').forEach(b=>b.onclick=()=>{saleForm.delMoneda=b.dataset.v;if(b.dataset.v==='DIVISAS')saleForm.delTasa='';renderKeep('ventas')});
    const dt=document.getElementById('delToggle');
    if(dt)dt.onclick=()=>{saleForm.delivery=!saleForm.delivery;if(!saleForm.delivery){saleForm.delMonto='';saleForm.delTasa=''}renderKeep('ventas')};
    sf.onsubmit=e=>{e.preventDefault();submitSale()};
  }
  // Gastos form
  const ef=document.getElementById('expForm');
  if(ef){
    ef.querySelectorAll('[name]').forEach(el=>el.addEventListener('input',()=>{expForm[el.name]=el.value;
      if(el.name==='monto'||el.name==='tasa')refreshExpCalc()}));
    ef.querySelectorAll('[data-seg="moneda"] button').forEach(b=>b.onclick=()=>{expForm.moneda=b.dataset.v;if(b.dataset.v==='DIVISAS')expForm.tasa='';renderKeep('gastos')});
    ef.onsubmit=e=>{e.preventDefault();submitExp()};
  }
  // Envíos form
  const shf=document.getElementById('shipForm');
  if(shf){
    shf.querySelectorAll('[name]').forEach(el=>el.addEventListener('input',()=>{shipForm[el.name]=el.value;}));
    shf.querySelectorAll('[data-seg="estatus"] button').forEach(b=>b.onclick=()=>{shipForm.estatus=b.dataset.v;renderKeep('envios')});
    shf.querySelectorAll('[data-seg="moneda"] button').forEach(b=>b.onclick=()=>{shipForm.moneda=b.dataset.v;renderKeep('envios')});
    const add=document.getElementById('shipModelAdd');
    if(add)add.onchange=()=>{const v=add.value;if(v&&!shipForm.modelos.includes(v))shipForm.modelos.push(v);renderKeep('envios')};
    shf.querySelectorAll('.pchip [data-rm]').forEach(b=>b.onclick=()=>{shipForm.modelos.splice(+b.dataset.rm,1);renderKeep('envios')});
    shf.onsubmit=e=>{e.preventDefault();submitShip()};
  }
  document.querySelectorAll('.status-filter .mchip').forEach(b=>b.onclick=()=>{shipFilter=b.dataset.f;renderKeep('envios')});
  document.querySelectorAll('.st-set').forEach(b=>b.onclick=()=>{
    const id=b.closest('.ship-card').dataset.id;const s=db.shipments.find(x=>x.id===id);
    if(s){s.estatus=b.dataset.set;save();renderKeep('envios');toast('Estatus: '+ST_LABEL[s.estatus])}});
  document.querySelectorAll('.act-del-ship').forEach(b=>b.onclick=()=>{
    const id=b.closest('.ship-card').dataset.id;
    confirmModal('Eliminar envío','¿Eliminar este envío de la lista?',()=>{db.shipments=db.shipments.filter(x=>x.id!==id);renderKeep('envios');save();toast('Envío eliminado')})});
  document.querySelectorAll('.act-edit-sale').forEach(b=>b.onclick=()=>{const id=b.closest('tr').dataset.id;openEditSale(id)});
  document.querySelectorAll('.act-del-sale').forEach(b=>b.onclick=()=>{
    const id=b.closest('tr').dataset.id;const s=db.sales.find(x=>x.id===id);
    confirmModal('Eliminar venta','¿Eliminar esta venta de '+s.modelo+'? Se devolverá 1 unidad al stock'+(db.expenses.some(e=>e.fromSale===id)?' y se borrará su delivery asociado':'')+'.',()=>{
      const it=db.inventory.find(x=>x.modelo===s.modelo);if(it)it.stockActual=(+it.stockActual||0)+1;
      db.sales=db.sales.filter(x=>x.id!==id);
      db.expenses=db.expenses.filter(e=>e.fromSale!==id);
      render();toast('Venta eliminada · stock devuelto')});
  });
  document.querySelectorAll('.act-edit-exp').forEach(b=>b.onclick=()=>{const id=b.closest('tr').dataset.id;openEditExp(id)});
  document.querySelectorAll('.act-del-exp').forEach(b=>b.onclick=()=>{
    const id=b.closest('tr').dataset.id;const ex=db.expenses.find(x=>x.id===id);
    const linked=ex&&ex.fromSale;
    confirmModal('Eliminar gasto',linked?'Este gasto es el delivery de una venta. Al borrarlo, la ganancia de esa venta subirá. ¿Continuar?':'¿Eliminar este gasto?',()=>{
      if(linked){const s=db.sales.find(x=>x.id===ex.fromSale);if(s){s.deliveryUSD=0}}
      db.expenses=db.expenses.filter(x=>x.id!==id);render();toast('Gasto eliminado')});
  });
}
function updateStockBadge(tr,s){const b=tr.querySelector('.badge');if(!b)return;b.className='badge '+(s<=0?'stock-out':s<=1?'stock-low':'stock-ok');b.textContent=s<=0?'Agotado':s<=1?'Bajo':'OK'}
function renderInvKeepFocus(pos){const app=document.getElementById('app');app.innerHTML=viewInventario();wire();const i=document.getElementById('invSearch');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}}
function renderKeep(v){const app=document.getElementById('app');app.innerHTML=(v==='ventas'?viewVentas():v==='gastos'?viewGastos():viewEnvios());wire()}

function refreshCalc(){
  const c=saleCalc();const calc=document.querySelector('.calc');if(!calc)return;
  const isBs=saleForm.tipoPago==='BOLIVARES';
  calc.innerHTML=`<div class="calc-row"><span class="k">Costo landed (auto)</span><span class="v muted">${c.m?fUSD(c.costo):'—'}</span></div>
    <div class="calc-row"><span class="k">Ingreso real USD</span><span class="v">${fUSD(c.ingreso)}</span></div>
    ${isBs?`<div class="calc-row"><span class="k">Cálculo ingreso</span><span class="v muted" style="font-size:12.5px">${c.monto?int.format(c.monto):0} ÷ ${c.tasa||0}</span></div>`:''}
    ${c.delUSD>0?`<div class="calc-row"><span class="k">Delivery</span><span class="v neg">-${fUSD(c.delUSD)}</span></div>`:''}
    <div class="calc-row calc-total"><span class="k">Ganancia neta</span><span class="v ${c.ganancia>=0?'pos':'neg'}">${fUSD(c.ganancia)}</span></div>
    ${c.m&&c.m.stockActual<=0?`<div class="hint" style="color:var(--red);margin-top:10px">⚠ Este modelo está agotado. Igual puedes registrar la venta.</div>`:''}`;
}
function refreshExpCalc(){const g=expCalc();const el=document.querySelector('#expForm .calc-total .v');if(el)el.textContent=fUSD(g);const side=document.querySelector('.calc .calc-total .v');if(side&&side!==el)side.textContent=fUSD(expCalc());}

function submitSale(){
  const c=saleCalc();
  if(!saleForm.modelo){toast('Selecciona un modelo');return}
  if(!(c.monto>0)){toast('Ingresa el monto recibido');return}
  if(saleForm.tipoPago==='BOLIVARES'&&!(c.tasa>0)){toast('Ingresa la tasa de cambio');return}
  const m=c.m;
  if(saleForm.delivery&&saleForm.delMoneda==='BOLIVARES'&&!((parseFloat(saleForm.delTasa)||0)>0)){toast('Ingresa la tasa del delivery');return}
  const sid=uid();
  db.sales.push({id:sid,fecha:saleForm.fecha||todayISO(),modelo:m.modelo,tipoPago:saleForm.tipoPago,monto:c.monto,tasa:saleForm.tipoPago==='BOLIVARES'?c.tasa:null,ingresoUSD:c.ingreso,costoLanded:c.costo,ganancia:c.ingreso-c.costo,deliveryUSD:c.delUSD,nota:saleForm.nota||''});
  if(c.delUSD>0){
    db.expenses.push({id:uid(),fecha:saleForm.fecha||todayISO(),concepto:'Delivery · '+m.modelo,moneda:saleForm.delMoneda,monto:parseFloat(saleForm.delMonto)||0,tasa:saleForm.delMoneda==='BOLIVARES'?(parseFloat(saleForm.delTasa)||0):null,gastoUSD:c.delUSD,kind:'delivery',fromSale:sid});
  }
  m.stockActual=(+m.stockActual||0)-1;
  saleForm={fecha:todayISO(),modelo:'',tipoPago:'DIVISAS',monto:'',tasa:'',nota:'',delivery:false,delMoneda:'BOLIVARES',delMonto:'',delTasa:''};
  render();toast('✓ Venta registrada · '+m.modelo+' (stock '+m.stockActual+')');
}
function submitExp(){
  const g=expCalc();
  if(!expForm.concepto.trim()){toast('Escribe el concepto');return}
  if(!(parseFloat(expForm.monto)>0)){toast('Ingresa el monto');return}
  if(expForm.moneda==='BOLIVARES'&&!(parseFloat(expForm.tasa)>0)){toast('Ingresa la tasa de cambio');return}
  db.expenses.push({id:uid(),fecha:expForm.fecha||todayISO(),concepto:expForm.concepto.trim(),moneda:expForm.moneda,monto:parseFloat(expForm.monto),tasa:expForm.moneda==='BOLIVARES'?parseFloat(expForm.tasa):null,gastoUSD:g});
  expForm={fecha:todayISO(),concepto:'',moneda:'DIVISAS',monto:'',tasa:''};
  render();toast('✓ Gasto registrado');
}
function submitShip(){
  if(!shipForm.telefono.trim()&&!shipForm.modelos.length){toast('Agrega al menos el número o un modelo');return}
  db.shipments.push({id:uid(),fecha:shipForm.fecha||todayISO(),estatus:shipForm.estatus,telefono:shipForm.telefono.trim(),modelos:[...shipForm.modelos],moneda:shipForm.moneda,total:shipForm.total!==''?parseFloat(shipForm.total):'',horaMin:shipForm.horaMin,horaMax:shipForm.horaMax,ubicacion:shipForm.ubicacion.trim(),link:shipForm.link.trim()});
  shipForm={fecha:todayISO(),estatus:'proceso',telefono:'',modelos:[],moneda:'DIVISAS',total:'',horaMin:'',horaMax:'',ubicacion:'',link:''};
  render();toast('✓ Envío agregado');
}

      ${curDirect?`<div style="border-radius:10px;overflow:hidden;background:#0d0e11;text-align:center;max-height:160px;display:flex;align-items:center;justify-content:center"><img id="pePreview" src="${esc(curDirect)}" style="max-height:160px;max-width:100%;object-fit:contain;display:block" /></div>`:''}
      <div class="field">
        <label class="lbl">Link de la imagen</label>
        <input class="inp" id="peInput" type="url" placeholder="Link de Google Drive o URL directa de imagen" value="${esc(cur)}" />
        <div class="hint">Funciona con Google Drive, Dropbox, Imgur u otras URLs directas de imagen</div>
      </div>
    </div>
    <div class="modal-foot" style="justify-content:space-between">
      <div>${cur?`<button class="btn btn-ghost" id="peRemove" style="color:var(--red)">Quitar foto</button>`:''}</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" id="mcancel">Cancelar</button>
        <button class="btn btn-gold" id="peSave">Guardar</button>
      </div>
    </div>
  </div></div>`;
  const close=closeModal;
  document.getElementById('mx').onclick=close;
  document.getElementById('mcancel').onclick=close;
  document.getElementById('mback').onclick=e=>{if(e.target.id==='mback')close()};
  // live preview on input change
  const inp=document.getElementById('peInput');
  const prev=document.getElementById('pePreview');
  if(inp&&prev)inp.oninput=()=>{const u=gdriveDirect(inp.value.trim());prev.src=u||'';prev.style.display=u?'block':'none'};

  setTimeout(()=>{if(inp){inp.focus();inp.select()}},60);
}

function openEditSale(id,tmp){
  const s=db.sales.find(x=>x.id===id);if(!s)return;
  const cur=tmp||{fecha:s.fecha,modelo:s.modelo,tipoPago:s.tipoPago,monto:s.monto,tasa:s.tasa||'',nota:s.nota||''};
  const isBs=cur.tipoPago==='BOLIVARES';
  const opts=db.inventory.map(m=>`<option value="${m.id}" ${m.modelo===cur.modelo?'selected':''}>${esc(m.modelo)} · stock ${m.stockActual}</option>`).join('');
  document.getElementById('modal-root').innerHTML=`<div class="modal-back" id="mback"><div class="modal" style="max-width:520px">
    <div class="modal-head"><h3>Editar venta</h3><button class="btn-ghost btn" id="mx" style="padding:4px 8px">✕</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="field"><label class="lbl">Fecha</label><input class="inp" id="esf-fecha" type="date" value="${esc(cur.fecha)}" /></div>
      <div class="field"><label class="lbl">Modelo</label><select class="inp" id="esf-modelo"><option value="">Seleccionar…</option>${opts}</select></div>
      <div class="field full"><label class="lbl">Tipo de pago</label><div class="seg" id="esf-tipo"><button type="button" data-v="DIVISAS" class="${!isBs?'on':''}">Divisas ($)</button><button type="button" data-v="BOLIVARES" class="${isBs?'on':''}">Bolívares (Bs)</button></div></div>
      <div class="field ${isBs?'':'full'}"><label class="lbl">Monto recibido ${isBs?'(Bs)':'($)'}</label><input class="inp" id="esf-monto" type="number" step="any" placeholder="0" value="${esc(cur.monto)}" /></div>
      ${isBs?`<div class="field"><label class="lbl">Tasa de cambio</label><input class="inp" id="esf-tasa" type="number" step="any" placeholder="Bs por $" value="${esc(cur.tasa)}" /></div>`:`<input type="hidden" id="esf-tasa" value="" />`}
      <div class="field full"><label class="lbl">Nota (opcional)</label><input class="inp" id="esf-nota" type="text" placeholder="Ej. cliente, fiado…" value="${esc(cur.nota)}" /></div>
    </div></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="mcancel">Cancelar</button><button class="btn btn-gold" id="esf-save">Guardar cambios</button></div>
  </div></div>`;
  const close=closeModal;
  document.getElementById('mx').onclick=close;document.getElementById('mcancel').onclick=close;
  document.getElementById('mback').onclick=ev=>{if(ev.target.id==='mback')close()};
  document.querySelectorAll('#esf-tipo button').forEach(b=>b.onclick=()=>{
    const selEl=document.getElementById('esf-modelo');
    const inv=db.inventory.find(x=>x.id===selEl.value);
    openEditSale(id,{fecha:document.getElementById('esf-fecha').value,modelo:inv?inv.modelo:cur.modelo,tipoPago:b.dataset.v,monto:document.getElementById('esf-monto').value,tasa:'',nota:document.getElementById('esf-nota').value});
  });
  document.getElementById('esf-save').onclick=()=>{
    const fecha=document.getElementById('esf-fecha').value;
    const invId=document.getElementById('esf-modelo').value;
    const inv=db.inventory.find(x=>x.id===invId);
    const monto=parseFloat(document.getElementById('esf-monto').value)||0;
    const tasa=parseFloat(document.getElementById('esf-tasa').value)||0;
    const nota=document.getElementById('esf-nota').value.trim();
    if(!invId){toast('Selecciona un modelo');return}
    if(!(monto>0)){toast('Ingresa el monto');return}
    if(isBs&&!(tasa>0)){toast('Ingresa la tasa de cambio');return}
    const ingresoUSD=isBs?(tasa>0?monto/tasa:0):monto;
    const costoLanded=inv?+inv.costo:s.costoLanded;
    s.fecha=fecha;s.modelo=inv?inv.modelo:s.modelo;s.tipoPago=cur.tipoPago;s.monto=monto;
    s.tasa=isBs?tasa:null;s.ingresoUSD=ingresoUSD;s.costoLanded=costoLanded;
    s.ganancia=ingresoUSD-costoLanded;s.nota=nota;
    close();save();render();toast('✓ Venta actualizada');
  };
}

function openEditExp(id,tmp){
  const ex=db.expenses.find(x=>x.id===id);if(!ex)return;
  const cur=tmp||{fecha:ex.fecha,concepto:ex.concepto,moneda:ex.moneda,monto:ex.monto,tasa:ex.tasa||''};
  const isBs=cur.moneda==='BOLIVARES';
  document.getElementById('modal-root').innerHTML=`<div class="modal-back" id="mback"><div class="modal" style="max-width:480px">
    <div class="modal-head"><h3>Editar gasto</h3><button class="btn-ghost btn" id="mx" style="padding:4px 8px">✕</button></div>
    <div class="modal-body"><div class="form-grid">
      <div class="field"><label class="lbl">Fecha</label><input class="inp" id="eef-fecha" type="date" value="${esc(cur.fecha)}" /></div>
      <div class="field"><label class="lbl">Moneda</label><div class="seg" id="eef-moneda"><button type="button" data-v="DIVISAS" class="${!isBs?'on':''}">Divisas ($)</button><button type="button" data-v="BOLIVARES" class="${isBs?'on':''}">Bolívares (Bs)</button></div></div>
      <div class="field full"><label class="lbl">Concepto</label><input class="inp" id="eef-concepto" type="text" placeholder="Ej. Delivery MRW" value="${esc(cur.concepto)}" /></div>
      <div class="field ${isBs?'':'full'}"><label class="lbl">Monto ${isBs?'(Bs)':'($)'}</label><input class="inp" id="eef-monto" type="number" step="any" placeholder="0" value="${esc(cur.monto)}" /></div>
      ${isBs?`<div class="field"><label class="lbl">Tasa de cambio</label><input class="inp" id="eef-tasa" type="number" step="any" placeholder="Bs por $" value="${esc(cur.tasa)}" /></div>`:`<input type="hidden" id="eef-tasa" value="" />`}
    </div></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="mcancel">Cancelar</button><button class="btn btn-gold" id="eef-save">Guardar cambios</button></div>
  </div></div>`;
  const close=closeModal;
  document.getElementById('mx').onclick=close;document.getElementById('mcancel').onclick=close;
  document.getElementById('mback').onclick=ev=>{if(ev.target.id==='mback')close()};
  document.querySelectorAll('#eef-moneda button').forEach(b=>b.onclick=()=>{
    openEditExp(id,{fecha:document.getElementById('eef-fecha').value,concepto:document.getElementById('eef-concepto').value,moneda:b.dataset.v,monto:document.getElementById('eef-monto').value,tasa:''});
  });
  document.getElementById('eef-save').onclick=()=>{
    const fecha=document.getElementById('eef-fecha').value;
    const concepto=document.getElementById('eef-concepto').value.trim();
    const monto=parseFloat(document.getElementById('eef-monto').value)||0;
    const tasa=parseFloat(document.getElementById('eef-tasa').value)||0;
    if(!concepto){toast('Escribe el concepto');return}
    if(!(monto>0)){toast('Ingresa el monto');return}
    if(isBs&&!(tasa>0)){toast('Ingresa la tasa de cambio');return}
    const gastoUSD=isBs?(tasa>0?monto/tasa:0):monto;
    ex.fecha=fecha;ex.concepto=concepto;ex.moneda=cur.moneda;ex.monto=monto;
    ex.tasa=isBs?tasa:null;ex.gastoUSD=gastoUSD;
    close();save();render();toast('✓ Gasto actualizado');
  };
}

      <button class="btn" id="bReset" style="justify-content:center">Restablecer a datos originales del Excel</button>

initData();
